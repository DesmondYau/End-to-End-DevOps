<svg viewBox="0 0 1240 780" width="1240" height="780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shopper traffic enters through the Internet Gateway to one ALB with a node in each of the three public subnets, which forwards to EKS worker nodes in private subnets across three availability zones; nodes reach the internet through a NAT Gateway per AZ; the EKS control plane reaches nodes via ENIs; Terraform state in S3 and DynamoDB sits outside the VPC.">
  <title>AWS architecture: VPC, EKS, ALB, NAT, and Terraform state</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2933; }
    .title { font-weight: 700; }
    .mono { font-family: "SFMono-Regular", Consolas, Menlo, monospace; }
    .small { font-size: 13px; }
  </style>

  <rect x="0" y="0" width="1240" height="780" fill="#ffffff"/>

  <!-- Shopper -->
  <g aria-hidden="true">
    <circle cx="150" cy="40" r="12" fill="none" stroke="#1f2933" stroke-width="2"/>
    <path d="M132,78 Q150,54 168,78" fill="none" stroke="#1f2933" stroke-width="2"/>
  </g>
  <text x="150" y="98" text-anchor="middle" class="small">Shopper</text>

  <!-- Internet cloud -->
  <g aria-hidden="true">
    <path d="M520,55 a22,22 0 0,1 0,-44 a28,28 0 0,1 54,-8 a24,24 0 0,1 8,52 z"
          fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  </g>
  <text x="565" y="35" text-anchor="middle" class="small">Internet</text>

  <line x1="196" x2="492" y1="40" y2="40" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="340" y="30" text-anchor="middle" class="small">HTTP request</text>

  <line x1="548" x2="450" y1="74" y2="172" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="415" y="125" text-anchor="middle" class="small" fill="#2563eb">ingress</text>

  <line x1="500" x2="588" y1="172" y2="74" stroke="#d97706" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="640" y="125" text-anchor="middle" class="small" fill="#d97706">egress (via NAT)</text>

  <!-- AWS account boundary -->
  <rect x="60" y="110" width="1130" height="580" rx="10" fill="none" stroke="#FF9900" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="80" y="134" class="small title" fill="#b45309">AWS ACCOUNT · us-east-1</text>

  <!-- VPC -->
  <rect x="90" y="150" width="770" height="500" rx="8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="110" y="172" class="small title" fill="#1d4ed8">VPC · 10.0.0.0/16</text>

  <!-- IGW -->
  <rect x="390" y="170" width="140" height="42" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="460" y="196" text-anchor="middle" class="small">Internet Gateway</text>

  <!-- IGW -> ALB, routed down the gap between AZ a and AZ b -->
  <polyline points="400,212 400,224 340,224 340,282" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AZ columns -->
  <g>
    <rect x="110" y="236" width="220" height="168" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="220" y="254" text-anchor="middle" class="small title">AZ us-east-1a</text>
    <text x="220" y="270" text-anchor="middle" class="small">Public subnet 10.0.1.0/24</text>
    <rect x="225" y="352" width="90" height="36" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="270" y="374" text-anchor="middle" class="small">NAT Gateway</text>

    <rect x="110" y="470" width="220" height="120" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
    <text x="220" y="490" text-anchor="middle" class="small">Private subnet 10.0.11.0/24</text>
    <rect x="165" y="504" width="110" height="36" rx="5" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
    <text x="220" y="526" text-anchor="middle" class="small">EKS worker node</text>
  </g>

  <g>
    <rect x="350" y="236" width="220" height="168" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="460" y="254" text-anchor="middle" class="small title">AZ us-east-1b</text>
    <text x="460" y="270" text-anchor="middle" class="small">Public subnet 10.0.2.0/24</text>
    <rect x="465" y="352" width="90" height="36" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="510" y="374" text-anchor="middle" class="small">NAT Gateway</text>

    <rect x="350" y="470" width="220" height="120" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
    <text x="460" y="490" text-anchor="middle" class="small">Private subnet 10.0.12.0/24</text>
    <rect x="405" y="504" width="110" height="36" rx="5" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
    <text x="460" y="526" text-anchor="middle" class="small">EKS worker node</text>
  </g>

  <g>
    <rect x="590" y="236" width="220" height="168" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="700" y="254" text-anchor="middle" class="small title">AZ us-east-1c</text>
    <text x="700" y="270" text-anchor="middle" class="small">Public subnet 10.0.3.0/24</text>
    <rect x="705" y="352" width="90" height="36" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="750" y="374" text-anchor="middle" class="small">NAT Gateway</text>

    <rect x="590" y="470" width="220" height="120" rx="6" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.5"/>
    <text x="700" y="490" text-anchor="middle" class="small">Private subnet 10.0.13.0/24</text>
    <rect x="645" y="504" width="110" height="36" rx="5" fill="#ffffff" stroke="#4b5563" stroke-width="1.5"/>
    <text x="700" y="526" text-anchor="middle" class="small">EKS worker node</text>
  </g>

  <!-- ALB: one load balancer spanning all three public subnets, with a node in each -->
  <rect x="118" y="284" width="684" height="58" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="460" y="302" text-anchor="middle" class="small"><tspan class="title">Application Load Balancer</tspan> · internet-facing · one ALB, a node in each public subnet</text>
  <rect x="130" y="310" width="80" height="26" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="170" y="327" text-anchor="middle" class="small">ALB node</text>
  <rect x="370" y="310" width="80" height="26" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="410" y="327" text-anchor="middle" class="small">ALB node</text>
  <rect x="610" y="310" width="80" height="26" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="327" text-anchor="middle" class="small">ALB node</text>

  <!-- ALB nodes -> pod IPs on the worker nodes (target-type: ip) -->
  <line x1="170" y1="342" x2="170" y2="502" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="410" y1="342" x2="410" y2="502" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <line x1="650" y1="342" x2="650" y2="502" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <text x="340" y="442" text-anchor="middle" class="small" fill="#b45309">to pod IPs</text>

  <!-- node -> NAT (egress) within each column -->
  <line x1="270" y1="504" x2="270" y2="390" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="504" x2="510" y2="390" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="504" x2="750" y2="390" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EKS control plane -->
  <rect x="900" y="320" width="260" height="104" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1030" y="350" text-anchor="middle" class="small title">EKS control plane</text>
  <text x="1030" y="368" text-anchor="middle" class="small">managed by AWS</text>
  <text x="1030" y="384" text-anchor="middle" class="small">(outside the VPC)</text>

  <!-- control plane -> ENIs in every private subnet, routed along the bottom of the VPC -->
  <polyline points="900,410 835,410 835,612 220,612" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="220" y1="612" x2="220" y2="593" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="460" y1="612" x2="460" y2="593" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <line x1="700" y1="612" x2="700" y2="593" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <text x="460" y="632" text-anchor="middle" class="small" fill="#15803d">ENIs into every private subnet</text>

  <!-- Terraform state backend -->
  <rect x="900" y="470" width="260" height="150" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1030" y="494" text-anchor="middle" class="small title">Terraform state backend</text>
  <text x="1030" y="510" text-anchor="middle" class="small">(outside the VPC)</text>

  <rect x="925" y="524" width="90" height="36" rx="18" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="970" y="546" text-anchor="middle" class="small">S3 bucket</text>

  <rect x="1035" y="524" width="100" height="36" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1085" y="546" text-anchor="middle" class="small">DynamoDB</text>

  <text x="1030" y="580" text-anchor="middle" class="small" fill="#6b7280">state + lock, written by</text>
  <text x="1030" y="596" text-anchor="middle" class="mono small" fill="#6b7280">terraform apply</text>

  <!-- caption -->
  <text x="620" y="712" text-anchor="middle" class="small" fill="#374151">Shoppers reach pods through the IGW and one ALB, which runs a node in each public subnet, into private-subnet EKS nodes across 3 AZs.</text>
  <text x="620" y="730" text-anchor="middle" class="small" fill="#374151">Nodes reach AWS APIs and image registries through a NAT Gateway per AZ; the control plane reaches nodes via ENIs.</text>
  <text x="620" y="748" text-anchor="middle" class="small" fill="#374151">Terraform state (S3 + DynamoDB) is outside the VPC and unrelated to runtime traffic.</text>
</svg>
